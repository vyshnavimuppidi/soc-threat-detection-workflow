<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" style="background:#0f172a;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="30" y="40" fill="#ffffff" font-size="18" font-weight="bold">🔄 SOC Analyst Investigation &amp; Incident Closure Lifecycle</text>
  <text x="30" y="60" fill="#94a3b8" font-size="12">Standard Operating Procedure (SOP) from Alert Ingestion to Post-Incident SIEM Tuning</text>

  <!-- Step 1 -->
  <g transform="translate(30, 85)">
    <rect width="125" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#3b82f6"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">1</text>
    <text x="15" y="70" fill="#60a5fa" font-size="13" font-weight="bold">Alert Intake</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Wazuh Webhook</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• Rule ID 87105</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• Severity Classify</text>
    <rect x="15" y="145" width="95" height="22" rx="4" fill="#1e3a8a"/>
    <text x="25" y="160" fill="#93c5fd" font-size="10" font-weight="bold">P1 / Critical</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 165 175 L 180 175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="170" fill="#94a3b8" font-size="14">→</text>

  <!-- Step 2 -->
  <g transform="translate(180, 85)">
    <rect width="125" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#8b5cf6"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">2</text>
    <text x="15" y="70" fill="#a78bfa" font-size="13" font-weight="bold">SIEM Triage</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Process Tree</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• Sysmon Event 3</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• Temp folder exec</text>
    <rect x="15" y="145" width="95" height="22" rx="4" fill="#4c1d95"/>
    <text x="22" y="160" fill="#ddd6fe" font-size="10" font-weight="bold">Wazuh DeepLink</text>
  </g>

  <!-- Arrow 2 -->
  <text x="315" y="170" fill="#94a3b8" font-size="14">→</text>

  <!-- Step 3 -->
  <g transform="translate(330, 85)">
    <rect width="125" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#f59e0b"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">3</text>
    <text x="15" y="70" fill="#fbbf24" font-size="13" font-weight="bold">Threat Intel</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Extract Public IP</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• Discard RFC1918</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• AbuseIPDB: 96%</text>
    <rect x="15" y="145" width="95" height="22" rx="4" fill="#78350f"/>
    <text x="22" y="160" fill="#fde68a" font-size="10" font-weight="bold">Index to SIEM</text>
  </g>

  <!-- Arrow 3 -->
  <text x="465" y="170" fill="#94a3b8" font-size="14">→</text>

  <!-- Step 4 -->
  <g transform="translate(480, 85)">
    <rect width="125" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#ef4444"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">4</text>
    <text x="15" y="70" fill="#f87171" font-size="13" font-weight="bold">Containment</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Isolate Host</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• Block IP on FW</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• Revoke Tokens</text>
    <rect x="15" y="145" width="95" height="22" rx="4" fill="#7f1d1d"/>
    <text x="20" y="160" fill="#fecaca" font-size="10" font-weight="bold">True Positive</text>
  </g>

  <!-- Arrow 4 -->
  <text x="615" y="170" fill="#94a3b8" font-size="14">→</text>

  <!-- Step 5 -->
  <g transform="translate(630, 85)">
    <rect width="125" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#10b981"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">5</text>
    <text x="15" y="70" fill="#34d399" font-size="13" font-weight="bold">AI Synthesis</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Ollama (Llama3)</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• 3-Bullet Briefing</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• HTML Report Gen</text>
    <rect x="15" y="145" width="95" height="22" rx="4" fill="#064e3b"/>
    <text x="20" y="160" fill="#a7f3d0" font-size="10" font-weight="bold">Dispatch Email</text>
  </g>

  <!-- Arrow 5 -->
  <text x="765" y="170" fill="#94a3b8" font-size="14">→</text>

  <!-- Step 6 -->
  <g transform="translate(780, 85)">
    <rect width="120" height="180" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#06b6d4"/>
    <text x="23" y="34" fill="#ffffff" font-size="14" font-weight="bold">6</text>
    <text x="15" y="70" fill="#22d3ee" font-size="13" font-weight="bold">Closure &amp; Tune</text>
    <text x="15" y="90" fill="#cbd5e1" font-size="10">• Update Ticket</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="10">• Tune Wazuh Rule</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="10">• Post-Mortem Log</text>
    <rect x="15" y="145" width="90" height="22" rx="4" fill="#164e63"/>
    <text x="20" y="160" fill="#a5f3fc" font-size="10" font-weight="bold">Case Closed</text>
  </g>
