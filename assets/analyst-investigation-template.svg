<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background:#0f172a;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect x="25" y="25" width="850" height="510" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Card Top Header -->
  <path d="M 25 35 Q 25 25 35 25 L 865 25 Q 875 25 875 35 L 875 95 L 25 95 Z" fill="url(#headerGrad)"/>
  <text x="50" y="60" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="0.5">🧑‍💻 SOC Analyst Investigation &amp; Triage Console</text>
  <text x="50" y="82" fill="#fecaca" font-size="12" font-family="monospace">Node ID: 7. Analyst Investigation &amp; Input • Pipeline: SOC SOAR v2.4</text>

  <!-- Status / Quick Badge -->
  <rect x="670" y="45" width="180" height="32" rx="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <circle cx="688" cy="61" r="5" fill="#22c55e"/>
  <text x="702" y="66" fill="#ffffff" font-size="12" font-weight="600">REVIEWED IN SIEM</text>

  <!-- Section 1: Analyst & Case Details Grid -->
  <rect x="50" y="115" width="800" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
  <!-- Col 1: Lead Analyst -->
  <text x="70" y="142" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">Assigned Analyst</text>
  <text x="70" y="168" fill="#38bdf8" font-size="15" font-weight="bold">Vyshnavi Muppidi</text>
  <text x="70" y="188" fill="#64748b" font-size="11">Lead SOC Incident Responder</text>

  <!-- Divider 1 -->
  <line x1="280" y1="125" x2="280" y2="200" stroke="#334155" stroke-width="1"/>

  <!-- Col 2: Final Verdict -->
  <text x="300" y="142" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">Triage Verdict</text>
  <rect x="300" y="152" width="230" height="30" rx="6" fill="#dc2626"/>
  <text x="315" y="172" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="0.5">TRUE POSITIVE - THREAT</text>

  <!-- Divider 2 -->
  <line x1="550" y1="125" x2="550" y2="200" stroke="#334155" stroke-width="1"/>

  <!-- Col 3: Review Time & Deep Link -->
  <text x="570" y="142" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">SIEM Investigation Target</text>
  <text x="570" y="166" fill="#a7f3d0" font-size="12" font-family="monospace">Rule ID: 87105 (Level 12)</text>
  <text x="570" y="188" fill="#38bdf8" font-size="11" text-decoration="underline">wazuh#/security-events?search=87105 ↗</text>

  <!-- Section 2: Investigation Notes & Root Cause Analysis -->
  <rect x="50" y="225" width="800" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="252" fill="#e2e8f0" font-size="13" font-weight="bold">🔍 Forensic Findings &amp; Threat Analysis</text>
  
  <rect x="70" y="265" width="760" height="65" rx="6" fill="#1e293b"/>
  <text x="85" y="288" fill="#cbd5e1" font-size="12" font-family="monospace">• Outbound beaconing confirmed to malicious C2 endpoint: 185.220.101.5 (Port 443).</text>
  <text x="85" y="306" fill="#cbd5e1" font-size="12" font-family="monospace">• AbuseIPDB confidence score: 96% (28 active abuse reports in last 24 hours).</text>
  <text x="85" y="324" fill="#cbd5e1" font-size="12" font-family="monospace">• Binary executed: C:\Windows\Temp\beacon_agent.exe via NT AUTHORITY\SYSTEM account.</text>

  <!-- Section 3: Remediation & Containment Actions Executed -->
  <rect x="50" y="360" width="800" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="385" fill="#4ade80" font-size="13" font-weight="bold">🛡️ Executed Remediation &amp; Containment Actions</text>
  
  <!-- Checkbox 1 -->
  <rect x="70" y="398" width="18" height="18" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="74" y="412" fill="#ffffff" font-size="13" font-weight="bold">✓</text>
  <text x="96" y="412" fill="#e2e8f0" font-size="12">Endpoint Isolation: LAPTOP-P3NHGSR9 quarantined from corporate subnet.</text>

  <!-- Checkbox 2 -->
  <rect x="70" y="424" width="18" height="18" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="74" y="438" fill="#ffffff" font-size="13" font-weight="bold">✓</text>
  <text x="96" y="438" fill="#e2e8f0" font-size="12">Firewall Egress Rule: Dropped all TCP/UDP traffic to 185.220.101.5 on perimeter.</text>

  <!-- Checkbox 3 -->
  <rect x="70" y="448" width="18" height="18" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="74" y="462" fill="#ffffff" font-size="13" font-weight="bold">✓</text>
  <text x="96" y="462" fill="#e2e8f0" font-size="12">Credential Invalidation: SYSTEM token revoked; Active Directory ticket cache purged.</text>

  <!-- Footer Tagline -->
  <text x="50" y="505" fill="#64748b" font-size="11">Automated SOC SOAR Platform • Certified Analyst Sign-off by Vyshnavi Muppidi • Encrypted SIEM Dispatch</text>
</svg>
